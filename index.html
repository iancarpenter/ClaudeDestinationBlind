<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>London Bus Destination Blind</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blind-bg: #0a0a0a;
      --blind-text: #f5f0e8;
      --via-color: #c8c0b0;
      --accent: #dc241f;
      --page-bg: #1a1a1a;
      --control-bg: #2a2a2a;
      --control-border: #444;
      --control-text: #ddd;
      --btn-hover: #3a3a3a;
    }

    body {
      min-height: 100vh;
      background: var(--page-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Jost', 'Gill Sans', 'Gill Sans MT', system-ui, sans-serif;
      padding: 2rem 1rem;
      gap: 2rem;
    }

    /* ── Page heading ── */
    .page-title {
      color: #888;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* ── Main wrapper (blind stack + controls stacked) ── */
    .main-wrapper {
      width: min(90vw, 860px);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: stretch;
    }

    /* ── Blind stack (route number box + destination blind) ── */
    .blind-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* ── Top row (route number + intermediate stops) ── */
    .top-row {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      align-items: stretch;
    }

    /* ── Route number wrapper ── */
    .route-number-wrapper {
      width: 25%;
    }

    /* Slide frames inside route-number-box and intermediate-stops must clear the vignette at z-index 10 */
    .route-number-box .slide-frame,
    .intermediate-stops .slide-frame {
      z-index: 12;
    }

    /* ── Route number box ── */
    .route-number-box {
      width: 100%;
      aspect-ratio: 16 / 8.907;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 8px 40px rgba(0,0,0,0.8),
        0 2px 8px rgba(0,0,0,0.6),
        inset 0 0 0 2px #222;
    }

    .mode-classic .route-number-box {
    }

    .mode-led .route-number-box {
      background: #0d0800;
      box-shadow:
        0 8px 40px rgba(0,0,0,0.8),
        0 0 30px rgba(255,140,0,0.08),
        0 2px 8px rgba(0,0,0,0.6),
        inset 0 0 0 2px #1a1200;
    }

    /* Vignette on route number box */
    .route-number-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          rgba(0,0,0,0.55) 0%,
          transparent 18%,
          transparent 82%,
          rgba(0,0,0,0.55) 100%);
      z-index: 10;
      pointer-events: none;
    }


    .static-route-number {
      position: relative;
      z-index: 12;
      font-family: 'Jost', 'Gill Sans', system-ui, sans-serif;
      font-weight: 900;
      font-size: clamp(1.5rem, 5vw, 4rem);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .mode-classic .static-route-number {
      color: var(--blind-text);
    }

    .mode-led .static-route-number {
      color: #ff8c00;
      text-shadow:
        0 0 10px rgba(255,140,0,0.8),
        0 0 20px rgba(255,140,0,0.4);
    }

    /* ── Intermediate stops container ── */
    .intermediate-stops {
      flex: 1;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      box-shadow:
        0 8px 40px rgba(0,0,0,0.8),
        0 2px 8px rgba(0,0,0,0.6),
        inset 0 0 0 2px #222;
    }

    .intermediate-stops.mode-classic {
    }

    .intermediate-stops.mode-led {
      background: #0d0800;
      box-shadow:
        0 8px 40px rgba(0,0,0,0.8),
        0 0 30px rgba(255,140,0,0.08),
        0 2px 8px rgba(0,0,0,0.6),
        inset 0 0 0 2px #1a1200;
    }

    /* Vignette on intermediate stops */
    .intermediate-stops::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          rgba(0,0,0,0.55) 0%,
          transparent 18%,
          transparent 82%,
          rgba(0,0,0,0.55) 100%);
      z-index: 10;
      pointer-events: none;
    }


    .stops-list {
      position: relative;
      z-index: 12;
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 4%;
      gap: 0.15em;
      width: 100%;
    }

    .stop-item {
      font-family: 'Jost', 'Gill Sans', system-ui, sans-serif;
      font-size: clamp(0.6rem, 1.6vw, 1.1rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.2;
      text-align: center;
    }

    .intermediate-stops.mode-classic .stop-item {
      color: var(--blind-text);
    }

    .intermediate-stops.mode-led .stop-item {
      color: #ff8c00;
      text-shadow: 0 0 8px rgba(255,140,0,0.7);
    }

    /* ── Blind wrapper ── */
    .blind-outer {
      width: 100%;
      aspect-ratio: 16 / 2.222;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      box-shadow:
        0 8px 40px rgba(0,0,0,0.8),
        0 2px 8px rgba(0,0,0,0.6),
        inset 0 0 0 2px #222;
      cursor: default;
    }

    /* Classic mode */
    .blind-outer.mode-classic {
    }

    /* Vignette overlay */
    .blind-outer::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          rgba(0,0,0,0.55) 0%,
          transparent 18%,
          transparent 82%,
          rgba(0,0,0,0.55) 100%);
      z-index: 10;
      pointer-events: none;
    }


    /* LED mode background */
    .blind-outer.mode-led {
      background: #0d0800;
      box-shadow:
        0 8px 40px rgba(0,0,0,0.8),
        0 0 30px rgba(255,140,0,0.08),
        0 2px 8px rgba(0,0,0,0.6),
        inset 0 0 0 2px #1a1200;
    }

    /* ── Blind inner layout ── */
    .blind-inner {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 5;
    }

    /* Destination + via area */
    .dest-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 0 4%;
    }


    /* ── CLASSIC TEXT ── */
    .mode-classic .destination-text {
      font-size: clamp(0.8rem, 3vw, 2.3rem);
      font-weight: 800;
      color: var(--blind-text);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.1;
      text-align: center;
    }

    .mode-classic .via-text {
      font-size: clamp(0.4rem, 1.35vw, 0.95rem);
      font-weight: 400;
      color: var(--via-color);
      text-align: center;
      letter-spacing: 0.06em;
    }

    /* ── LED TEXT ── */
    .mode-led .destination-text {
      font-size: clamp(0.8rem, 3vw, 2.3rem);
      font-weight: 800;
      color: #ff8c00;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.1;
      text-align: center;
      text-shadow:
        0 0 8px rgba(255,140,0,0.9),
        0 0 20px rgba(255,140,0,0.4);
    }

    .mode-led .via-text {
      font-size: clamp(0.4rem, 1.35vw, 0.95rem);
      font-weight: 400;
      color: #cc6600;
      text-align: center;
      letter-spacing: 0.06em;
      text-shadow: 0 0 6px rgba(255,140,0,0.5);
    }

    /* ── Slide transition (classic) ── */
    .slide-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .slide-frame {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      will-change: transform, filter;
    }

    .dest-group {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 0.6em;
    }

    .slide-frame.entering {
      animation: slideIn 300ms ease-out forwards;
    }
    .slide-frame.leaving {
      animation: slideOut 300ms ease-in forwards;
    }

    @keyframes slideIn {
      from { transform: translateY(100%); filter: blur(2px); opacity: 0.6; }
      to   { transform: translateY(0);    filter: blur(0);   opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateY(0);     filter: blur(0);   opacity: 1; }
      to   { transform: translateY(-100%); filter: blur(2px); opacity: 0.6; }
    }
    @keyframes slideInReverse {
      from { transform: translateY(-100%); filter: blur(2px); opacity: 0.6; }
      to   { transform: translateY(0);     filter: blur(0);   opacity: 1; }
    }
    @keyframes slideOutReverse {
      from { transform: translateY(0);    filter: blur(0);   opacity: 1; }
      to   { transform: translateY(100%); filter: blur(2px); opacity: 0.6; }
    }

    .slide-frame.entering-reverse { animation: slideInReverse  300ms ease-out forwards; }
    .slide-frame.leaving-reverse  { animation: slideOutReverse 300ms ease-in  forwards; }

    /* ── Strobe transition (LED) ── */
    .slide-frame.led-strobe {
      animation: ledStrobe 320ms steps(1) forwards;
    }
    .slide-frame.led-in {
      animation: ledIn 320ms steps(1) forwards;
    }

    @keyframes ledStrobe {
      0%   { opacity: 1; }
      33%  { opacity: 0; }
      66%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes ledIn {
      0%   { opacity: 0; }
      33%  { opacity: 0; }
      55%  { opacity: 1; }
      70%  { opacity: 0; }
      85%  { opacity: 1; }
      100% { opacity: 1; }
    }

    /* ── NOT IN SERVICE special style ── */
    .not-in-service .destination-text {
      font-size: clamp(0.6rem, 2.35vw, 1.75rem) !important;
      letter-spacing: 0.12em !important;
    }

    .mode-classic .not-in-service .destination-text {
      color: #888 !important;
    }

    .mode-led .not-in-service .destination-text {
      color: #774400 !important;
      text-shadow: none !important;
    }

    /* ── Controls panel ── */
    .controls-panel {
      border: 1px solid var(--control-border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .controls-panel-label {
      color: #888;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .control-groups {
      display: flex;
      flex-direction: row;
      gap: 1.5rem;
      align-self: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .group-label {
      color: #666;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .group-buttons {
      display: flex;
      flex-direction: row;
      gap: 0.4rem;
    }

    .btn {
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      color: var(--control-text);
      font-family: 'Jost', system-ui, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 0.5rem 1.1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 150ms, border-color 150ms, color 150ms;
      user-select: none;
    }

    .btn:hover { background: var(--btn-hover); border-color: #666; }
    .btn:active { transform: scale(0.97); }

    .btn-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      min-width: 3.5rem;
      padding: 0.45rem 0.75rem;
    }

    .btn-arrow { font-size: 1.1rem; line-height: 1; }
    .btn-label { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: #888; }

    /* ── Aria live ── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

  </style>
</head>
<body>

  <div class="main-wrapper">

  <div class="blind-stack">

    <div class="top-row">

      <div class="route-number-wrapper">
        <div class="route-number-box mode-classic" id="routeNumberBox" aria-label="Route 19">
          <div class="slide-wrapper">
            <div class="slide-frame" id="routeSlideCurrent">
              <span class="static-route-number" id="routeNumber">19</span>
            </div>
            <div class="slide-frame" id="routeSlideNext" style="opacity:0">
              <span class="static-route-number" id="routeNumberNext"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="intermediate-stops mode-classic" id="intermediateStops" aria-label="Intermediate stops">
        <div class="slide-wrapper">
          <div class="slide-frame" id="stopsSlideCurrent">
            <ul class="stops-list" id="stopsCurrent"></ul>
          </div>
          <div class="slide-frame" id="stopsSlideNext" style="opacity:0">
            <ul class="stops-list" id="stopsNext"></ul>
          </div>
        </div>
      </div>

    </div><!-- /.top-row -->

  <div class="blind-outer mode-classic" id="blindOuter" aria-label="London bus destination blind">

    <div class="blind-inner">

      <!-- Destination + via -->
      <div class="dest-area">
        <div class="slide-wrapper">
          <div class="slide-frame" id="slideCurrent">
            <div class="dest-group">
              <span class="destination-text" id="destCurrent"></span>
              <span class="via-text" id="viaCurrent"></span>
            </div>
          </div>
          <div class="slide-frame" id="slideNext" style="opacity:0">
            <div class="dest-group">
              <span class="destination-text" id="destNext"></span>
              <span class="via-text" id="viaNext"></span>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  </div><!-- /.blind-stack -->

  <!-- Controls -->
  <div class="controls-panel">
    <span class="controls-panel-label">Controls</span>
    <div class="control-groups">

      <div class="control-group">
        <span class="group-label">Route</span>
        <div class="group-buttons">
          <button class="btn btn-nav" id="btnRoutePrev" title="Previous route">
            <span class="btn-arrow">&#8593;</span>
            <span class="btn-label">Prev</span>
          </button>
          <button class="btn btn-nav" id="btnRouteNext" title="Next route">
            <span class="btn-arrow">&#8595;</span>
            <span class="btn-label">Next</span>
          </button>
        </div>
      </div>

      <div class="control-group">
        <span class="group-label">Destination</span>
        <div class="group-buttons">
          <button class="btn btn-nav" id="btnPrev" title="Previous destination">
            <span class="btn-arrow">&#8593;</span>
            <span class="btn-label">Prev</span>
          </button>
          <button class="btn btn-nav" id="btnNext" title="Next destination">
            <span class="btn-arrow">&#8595;</span>
            <span class="btn-label">Next</span>
          </button>
        </div>
      </div>

      <div class="control-group">
        <span class="group-label">Stops</span>
        <div class="group-buttons">
          <button class="btn btn-nav" id="btnStopsPrev" title="Previous stops">
            <span class="btn-arrow">&#8593;</span>
            <span class="btn-label">Prev</span>
          </button>
          <button class="btn btn-nav" id="btnStopsNext" title="Next stops">
            <span class="btn-arrow">&#8595;</span>
            <span class="btn-label">Next</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  </div><!-- /.main-wrapper -->

  <!-- Accessible live region -->
  <div aria-live="polite" aria-atomic="true" class="sr-only" id="liveRegion"></div>


  <script>
    'use strict';

    /* ── Destination data ── */
    const DESTINATIONS = [
      { destination: 'ARCHWAY STATION',        via: '' },
      { destination: 'BATTERSEA BDG RD',       via: 'HOWIE STREET' },
      { destination: 'BATTERSEA BRIDGE',       via: 'SOUTH SIDE' },
      { destination: 'BATTERSEA GARAGE',       via: '' },
      { destination: 'BLOOMSBURY',             via: '' },
      { destination: 'CLAPHAM JUNCTION',       via: '' },
      { destination: 'FINSBURY PARK',          via: 'PLIMSOLL ROAD' },
      { destination: 'FINSBURY PARK STATION',  via: '' },
      { destination: 'GREEN PARK',             via: '' },
      { destination: 'HIGHBURY BARN',          via: '' },
      { destination: 'HIGHBURY CORNER',        via: '' },
      { destination: 'HOLLOWAY ROAD',          via: 'PEMBERTON GARDENS' },
      { destination: 'HOLLOWAY ROAD',          via: 'via Finsbury Park' },
      { destination: 'HYDE PARK CORNER',       via: '' },
      { destination: 'ISLINGTON',              via: 'ANGEL' },
      { destination: 'ISLINGTON GREEN',        via: ''},
      { destination: 'KNIGHTSBRIDGE STN',      via: '' },
      { destination: 'NOT IN SERVICE',         via: '' },
      { destination: 'PICCADILLY CIRCUS',      via: '' },
      { destination: 'ROSEBERRY AVENUE',       via: '' },
      { destination: 'SLOANE SQUARE',          via: '' },
      { destination: 'TOOTING BEC STATION',    via: '' },
      { destination: 'TOTTENHAM CT RD STN',    via: '' },
      { destination: 'TUFNELL PARK',           via: 'via FINSBURY PARK' },
      { destination: 'UPPER HOLLOWAY STN',     via: '' },
    ];

    /* ── Route data ── */
    const ROUTES = ['4', '19'];
    const ROUTE_19_INDEX = ROUTES.indexOf('19');

    /* ── Intermediate stops data ── */
    const STOP_SETS = [
      ['Highbury Islington', 'Islington Green', 'Angel', 'Kings Cross', 'Euston'],
      ['Piccadilly Circus', 'Green Park', 'Hyde Park Corner', 'Knightsbridge', 'Sloane Sq'],
      ['Sloane Square', 'Chelsea', 'Battersea Bridge', 'Battersea', 'Clapham Junction'],
      ['Holloway Road', 'Highbury Corner', 'Islington', 'Clerkenwell', 'Holborn'],
      ['Finsbury Park', 'Drayton Park', 'Highbury Barn', 'Canonbury', 'Islington'],
    ];

    /* ── State ── */
    let currentIndex = 0;
    let isAnimating = false;
    let currentRouteIndex = ROUTE_19_INDEX;
    let isRouteAnimating = false;
    let currentStopsIndex = 0;
    let isStopsAnimating = false;

    /* ── DOM refs ── */
    const blindOuter          = document.getElementById('blindOuter');
    const routeNumberBox      = document.getElementById('routeNumberBox');
    const routeNumber         = document.getElementById('routeNumber');
    const routeNumberNext     = document.getElementById('routeNumberNext');
    const routeSlideCurrent   = document.getElementById('routeSlideCurrent');
    const routeSlideNext      = document.getElementById('routeSlideNext');
    const intermediateStops   = document.getElementById('intermediateStops');
    const slideCurrent   = document.getElementById('slideCurrent');
    const slideNext      = document.getElementById('slideNext');
    const destCurrent    = document.getElementById('destCurrent');
    const destNext       = document.getElementById('destNext');
    const viaCurrent     = document.getElementById('viaCurrent');
    const viaNext        = document.getElementById('viaNext');
    const liveRegion     = document.getElementById('liveRegion');
    const btnPrev        = document.getElementById('btnPrev');
    const btnNext        = document.getElementById('btnNext');
    const btnRoutePrev   = document.getElementById('btnRoutePrev');
    const btnRouteNext   = document.getElementById('btnRouteNext');
    const stopsSlideCurrent = document.getElementById('stopsSlideCurrent');
    const stopsSlideNext    = document.getElementById('stopsSlideNext');
    const stopsCurrent      = document.getElementById('stopsCurrent');
    const stopsNext         = document.getElementById('stopsNext');
    const btnStopsPrev      = document.getElementById('btnStopsPrev');
    const btnStopsNext      = document.getElementById('btnStopsNext');

    /* ── Render static (no animation) ── */
    function renderStatic(index) {
      const d = DESTINATIONS[index];
      destCurrent.textContent = d.destination;
      viaCurrent.textContent  = d.via;
      slideCurrent.classList.toggle('not-in-service', d.destination === 'NOT IN SERVICE');
      liveRegion.textContent = `${d.destination}. ${d.via}`;
    }

    /* ── Animate to next/prev ── */
    function animateTo(nextIndex, goingBack = false) {
      if (isAnimating || nextIndex === currentIndex) return;
      isAnimating = true;

      const d = DESTINATIONS[nextIndex];
      destNext.textContent    = d.destination;
      viaNext.textContent     = d.via;
      slideNext.classList.toggle('not-in-service', d.destination === 'NOT IN SERVICE');

      let enterClass, leaveClass;
      if (goingBack) {
        enterClass = 'entering-reverse';
        leaveClass = 'leaving-reverse';
      } else {
        enterClass = 'entering';
        leaveClass = 'leaving';
      }

      // Make next visible at start position
      slideNext.style.opacity = '1';

      // Trigger animations
      slideCurrent.classList.add(leaveClass);
      slideNext.classList.add(enterClass);

      const duration = 300;

      setTimeout(() => {
        // Swap: current becomes the new one
        currentIndex = nextIndex;

        destCurrent.textContent = d.destination;
        viaCurrent.textContent  = d.via;
        slideCurrent.classList.toggle('not-in-service', d.destination === 'NOT IN SERVICE');

        // Reset next to invisible / clean
        slideCurrent.classList.remove(leaveClass, enterClass);
        slideNext.classList.remove(leaveClass, enterClass);

        slideNext.style.opacity = '0';

        liveRegion.textContent = `${d.destination}. ${d.via}`;

        isAnimating = false;
      }, duration);
    }

    function advance()  { animateTo((currentIndex + 1) % DESTINATIONS.length, false); }
    function retreat()  { animateTo((currentIndex - 1 + DESTINATIONS.length) % DESTINATIONS.length, true); }

    /* ── Route number functions ── */
    function animateRoute(nextIndex, goingBack = false) {
      if (isRouteAnimating || nextIndex === currentRouteIndex) return;
      isRouteAnimating = true;

      const r = ROUTES[nextIndex];
      routeNumberNext.textContent = r;

      const enterClass = goingBack ? 'entering-reverse' : 'entering';
      const leaveClass = goingBack ? 'leaving-reverse'  : 'leaving';

      routeSlideNext.style.opacity = '1';
      routeSlideCurrent.classList.add(leaveClass);
      routeSlideNext.classList.add(enterClass);

      setTimeout(() => {
        currentRouteIndex = nextIndex;
        routeNumber.textContent = r;
        routeNumberBox.setAttribute('aria-label', `Route ${r}`);

        routeSlideCurrent.classList.remove(leaveClass, enterClass);
        routeSlideNext.classList.remove(leaveClass, enterClass);
        routeSlideNext.style.opacity = '0';

        liveRegion.textContent = `Route ${r}`;
        isRouteAnimating = false;
      }, 300);
    }

    function advanceRoute() {
      animateRoute((currentRouteIndex + 1) % ROUTES.length, false);
    }

    function retreatRoute() {
      animateRoute((currentRouteIndex - 1 + ROUTES.length) % ROUTES.length, true);
    }

    /* ── Intermediate stops functions ── */
    function populateStopsList(ulEl, stops) {
      ulEl.innerHTML = '';
      stops.forEach(stop => {
        const li = document.createElement('li');
        li.className = 'stop-item';
        li.textContent = stop;
        ulEl.appendChild(li);
      });
    }

    function renderStopsStatic(index) {
      populateStopsList(stopsCurrent, STOP_SETS[index]);
    }

    function animateStops(nextIndex, goingBack = false) {
      if (isStopsAnimating || nextIndex === currentStopsIndex) return;
      isStopsAnimating = true;

      populateStopsList(stopsNext, STOP_SETS[nextIndex]);

      const enterClass = goingBack ? 'entering-reverse' : 'entering';
      const leaveClass = goingBack ? 'leaving-reverse'  : 'leaving';

      stopsSlideNext.style.opacity = '1';
      stopsSlideCurrent.classList.add(leaveClass);
      stopsSlideNext.classList.add(enterClass);

      setTimeout(() => {
        currentStopsIndex = nextIndex;
        populateStopsList(stopsCurrent, STOP_SETS[nextIndex]);

        stopsSlideCurrent.classList.remove(leaveClass, enterClass);
        stopsSlideNext.classList.remove(leaveClass, enterClass);
        stopsSlideNext.style.opacity = '0';

        liveRegion.textContent = `Stops: ${STOP_SETS[nextIndex].join(', ')}`;
        isStopsAnimating = false;
      }, 300);
    }

    function advanceStops() {
      animateStops((currentStopsIndex + 1) % STOP_SETS.length, false);
    }

    function retreatStops() {
      animateStops((currentStopsIndex - 1 + STOP_SETS.length) % STOP_SETS.length, true);
    }

    /* ── Event listeners: destination ── */
    btnNext.addEventListener('click', () => { advance(); });
    btnPrev.addEventListener('click', () => { retreat(); });

    /* ── Event listeners: route number buttons ── */
    btnRoutePrev.addEventListener('click', () => { retreatRoute(); });
    btnRouteNext.addEventListener('click', () => { advanceRoute(); });

    /* ── Event listeners: stops buttons ── */
    btnStopsPrev.addEventListener('click', () => { retreatStops(); });
    btnStopsNext.addEventListener('click', () => { advanceStops(); });

    /* ── Keyboard: Up/Down → destination, Left/Right → route ── */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { advance(); }
      if (e.key === 'ArrowUp')   { retreat(); }
      if (e.key === 'ArrowRight') { advanceRoute(); }
      if (e.key === 'ArrowLeft')  { retreatRoute(); }
    });

    /* ── Scroll / swipe / drag on dest-area ── */
    const destArea = document.querySelector('.dest-area');

    // Mouse wheel
    destArea.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY > 0) advance(); else retreat();
    }, { passive: false });

    // Touch swipe
    let touchStartY = null;
    destArea.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    destArea.addEventListener('touchend', (e) => {
      if (touchStartY === null) return;
      const delta = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(delta) >= 40) { delta > 0 ? advance() : retreat(); }
      touchStartY = null;
    }, { passive: true });

    // Click-drag
    let dragStartY = null;
    destArea.addEventListener('mousedown', (e) => { dragStartY = e.clientY; });
    destArea.addEventListener('mouseup', (e) => {
      if (dragStartY === null) return;
      const delta = dragStartY - e.clientY;
      if (Math.abs(delta) >= 40) { delta > 0 ? advance() : retreat(); }
      dragStartY = null;
    });
    destArea.addEventListener('mouseleave', () => { dragStartY = null; });
    destArea.style.cursor = 'grab';

    /* ── Scroll / swipe / drag on route number box ── */

    // Mouse wheel
    routeNumberBox.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY > 0) advanceRoute(); else retreatRoute();
    }, { passive: false });

    // Touch swipe
    let routeTouchStartY = null;
    routeNumberBox.addEventListener('touchstart', (e) => {
      routeTouchStartY = e.touches[0].clientY;
    }, { passive: true });
    routeNumberBox.addEventListener('touchend', (e) => {
      if (routeTouchStartY === null) return;
      const delta = routeTouchStartY - e.changedTouches[0].clientY;
      if (Math.abs(delta) >= 20) { delta > 0 ? advanceRoute() : retreatRoute(); }
      routeTouchStartY = null;
    }, { passive: true });

    // Click-drag
    let routeDragStartY = null;
    routeNumberBox.addEventListener('mousedown', (e) => { routeDragStartY = e.clientY; });
    routeNumberBox.addEventListener('mouseup', (e) => {
      if (routeDragStartY === null) return;
      const delta = routeDragStartY - e.clientY;
      if (Math.abs(delta) >= 20) { delta > 0 ? advanceRoute() : retreatRoute(); }
      routeDragStartY = null;
    });
    routeNumberBox.addEventListener('mouseleave', () => { routeDragStartY = null; });
    routeNumberBox.style.cursor = 'grab';

    /* ── Init ── */
    renderStatic(0);
    renderStopsStatic(0);
  </script>

</body>
</html>
